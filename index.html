</style></head><body><main class="wrap"><div class="brand"><span class="brand-mark">栃</span><span>TOCHIGI LOVE QUIZ</span></div>
<section id="start" class="card"><div class="hero" aria-hidden="true">🍓</div><p class="eyebrow">あなたの地元愛を試そう</p><h1>あなたの栃木愛は<br>何点？</h1><p class="lead">日光、いちご、宇都宮餃子、益子焼。あなたは栃木をどこまで知っている？</p><div class="howto">全30問からランダムに<strong>10問</strong>出題！<br>4択・1問<strong>15秒</strong>／100点満点<br>正解8点＋早押しボーナス最大2点</div><button class="primary" id="start-btn" type="button">クイズを始める →</button></section>
<section id="quiz" class="card" hidden><div class="topline"><span id="count">第1問 / 10問</span><span id="score">0点</span></div><div class="track" role="progressbar" aria-label="進捗" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="fill" id="progress"></div></div><div id="timerbox" class="timerbox"><span>残り時間</span><span class="time" id="time">15.0秒</span></div><p class="question-tag" id="category"></p><h2 id="question" tabindex="-1"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback" aria-live="polite" hidden></div><button class="primary" id="next-btn" type="button" hidden>次の問題へ →</button></section>

<script>
const QUESTIONS=[{"c":"歴史","q":"世界遺産「日光の社寺」に含まれる神社は？","o":["日光二荒山神社","鹿島神宮","明治神宮","鶴岡八幡宮"],"a":0,"e":"日光東照宮・日光二荒山神社・日光山輪王寺が「日光の社寺」を構成します。"},{"c":"歴史","q":"日光東照宮がある市は？","o":["宇都宮市","日光市","足利市","佐野市"],"a":1,"e":"日光東照宮は日光市にあり、世界遺産「日光の社寺」の一つです。"},{"c":"自然","q":"日本三名瀑の一つ「華厳滝」がある市は？","o":["那須塩原市","鹿沼市","日光市","大田原市"],"a":2,"e":"華厳滝は日光市の奥日光にある滝です。"},{"c":"自然","q":"華厳滝へ流れ落ちる水のもととなる湖は？","o":["那須疏水","湯ノ湖","五十里湖","中禅寺湖"],"a":3,"e":"華厳滝は中禅寺湖から流れ出る水が岸壁を落ちる滝です。"},{"c":"自然","q":"中禅寺湖の形成に関係した火山は？","o":["男体山","富士山","赤城山","浅間山"],"a":0,"e":"中禅寺湖は男体山の噴火で流れた溶岩が谷をせき止め、形成されたとされます。"},{"c":"自然","q":"中禅寺湖はどの市にある？","o":["矢板市","日光市","真岡市","小山市"],"a":1,"e":"中禅寺湖は日光市の奥日光にある湖です。"},{"c":"名所","q":"大藤で知られる「あしかがフラワーパーク」がある市は？","o":["栃木市","小山市","足利市","佐野市"],"a":2,"e":"あしかがフラワーパークは足利市にあり、大藤がシンボルです。"},{"c":"名所","q":"大谷資料館で見学できる大きな地下空間は何の跡？","o":["金鉱","炭鉱","防空壕","石の採掘場"],"a":3,"e":"大谷資料館では大谷石の地下採掘場跡を見学できます。"},{"c":"名所","q":"大谷資料館がある市は？","o":["宇都宮市","足利市","小山市","佐野市"],"a":0,"e":"大谷資料館は宇都宮市大谷町にあります。"},{"c":"工芸","q":"「益子焼」の主な産地は？","o":["那須町","益子町","壬生町","野木町"],"a":1,"e":"益子焼は益子町を代表する焼き物です。"},{"c":"工芸","q":"益子焼の産地で春と秋に開催されるイベントは？","o":["花火大会","氷祭り","陶器市","雪まつり"],"a":2,"e":"益子町では春と秋に陶器市が開かれます。"},{"c":"人物","q":"益子焼の発展に影響した民芸運動ゆかりの陶芸家は？","o":["葛飾北斎","与謝野晶子","夏目漱石","濱田庄司"],"a":3,"e":"濱田庄司は益子に移り住み、民芸運動にも関わりました。"},{"c":"グルメ","q":"宇都宮のご当地グルメとして知られるものは？","o":["餃子","きりたんぽ","明石焼き","味噌煮込みうどん"],"a":0,"e":"宇都宮市は餃子の専門店が多いことで知られています。"},{"c":"グルメ","q":"栃木生まれのいちご品種はどれ？","o":["あまおう","とちおとめ","紅ほっぺ","章姫"],"a":1,"e":"とちおとめは栃木県生まれのいちご品種です。"},{"c":"グルメ","q":"「スカイベリー」は何の品種？","o":["ぶどう","梨","いちご","桃"],"a":2,"e":"スカイベリーは栃木生まれのいちご品種です。"},{"c":"グルメ","q":"佐野らーめんの特徴的な製麺方法は？","o":["石臼ひき","手延べ","機械打ちのみ","青竹打ち"],"a":3,"e":"佐野らーめんは青竹で麺を打つ製法が特徴です。"},{"c":"グルメ","q":"佐野らーめんの地元として知られる市は？","o":["佐野市","足利市","下野市","日光市"],"a":0,"e":"佐野市では佐野らーめんが地域に根付いています。"},{"c":"シンボル","q":"栃木県の県木は？","o":["ケヤキ","トチノキ","スギ","サクラ"],"a":1,"e":"栃木県の県木はトチノキです。"},{"c":"シンボル","q":"栃木県の県鳥は？","o":["タンチョウ","キジ","オオルリ","ハクチョウ"],"a":2,"e":"栃木県の県鳥は青い羽が美しいオオルリです。"},{"c":"シンボル","q":"栃木県の県花は？","o":["ひまわり","コスモス","梅","やしおつつじ"],"a":3,"e":"栃木県の県花はやしおつつじです。"},{"c":"シンボル","q":"栃木県の県獣は？","o":["カモシカ","シカ","キツネ","タヌキ"],"a":0,"e":"栃木県の県獣はカモシカです。"},{"c":"シンボル","q":"栃木県マスコットキャラクターの名前は？","o":["ぐんまちゃん","とちまるくん","コバトン","チーバくん"],"a":1,"e":"栃木県のマスコットはとちまるくんです。"},{"c":"シンボル","q":"「とちまるくん」の誕生日は？","o":["1月1日","6月15日","11月11日","12月25日"],"a":2,"e":"とちまるくんの誕生日は11月11日です。"},{"c":"歴史","q":"足利氏ゆかりの寺院「鑁阿寺」がある市は？","o":["栃木市","佐野市","宇都宮市","足利市"],"a":3,"e":"鑁阿寺は足利市にあり、足利氏の氏寺として知られます。"},{"c":"歴史","q":"鑁阿寺が地元で呼ばれる親しみのある名前は？","o":["大日様","お稲荷さん","観音様","お不動さん"],"a":0,"e":"鑁阿寺は「大日様」と呼ばれ親しまれています。"},{"c":"観光","q":"「SL・桜・菜の花街道」で紹介される市は？","o":["鹿沼市","真岡市","日光市","矢板市"],"a":1,"e":"真岡市ではSLと桜・菜の花の景観が観光資源です。"},{"c":"観光","q":"芝ざくら公園のある町は？","o":["那須町","益子町","市貝町","壬生町"],"a":2,"e":"市貝町の芝ざくら公園は県東エリアの観光スポットです。"},{"c":"観光","q":"「喜連川ポピー畑」がある市は？","o":["佐野市","足利市","宇都宮市","さくら市"],"a":3,"e":"喜連川ポピー畑はさくら市の花の名所です。"},{"c":"観光","q":"蔵の街並みで知られる県南の市は？","o":["栃木市","大田原市","矢板市","真岡市"],"a":0,"e":"栃木市には「小江戸」とも呼ばれる歴史的な蔵の街並みが残ります。"},{"c":"工芸","q":"真岡市で伝統的に作られてきた織物は？","o":["結城紬","真岡木綿","西陣織","博多織"],"a":1,"e":"真岡市には真岡木綿会館があり、機織りや染色の体験もできます。"}];
const $=id=>document.getElementById(id);
const state={selected:[],index:0,points:0,correct:0,deadline:0,timer:null,locked:false};
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){for(const key of ['start','quiz','result'])$(key).hidden=key!==id;window.scrollTo({top:0,behavior:'instant'})}
function stopTimer(){if(state.timer!==null){clearInterval(state.timer);state.timer=null}}
function start(){stopTimer();state.selected=shuffle(QUESTIONS).slice(0,10);state.index=0;state.points=0;state.correct=0;$('copy-btn').textContent='シェア用リンクをコピー';$('status').textContent='';show('quiz');render()}
function render(){state.locked=false;const q=state.selected[state.index];$('count').textContent=`第${state.index+1}問 / 10問`;$('score').textContent=`${state.points}点`;$('progress').style.width=`${state.index*10}%`;document.querySelector('.track').setAttribute('aria-valuenow',state.index);$('category').textContent=q.c;$('question').textContent=q.q;$('feedback').hidden=true;$('next-btn').hidden=true;$('timerbox').classList.remove('urgent');const area=$('answers');area.replaceChildren();q.o.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=`${'ABCD'[i]}. ${s}`;b.addEventListener('click',()=>answer(i));area.append(b)});state.deadline=performance.now()+15000;tick();state.timer=setInterval(tick,50);$('question').focus({preventScroll:true})}
function tick(){if(state.locked)return;const ms=Math.max(0,state.deadline-performance.now());$('time').textContent=`${(ms/1000).toFixed(1)}秒`;$('timerbox').classList.toggle('urgent',ms<=5000);if(ms<=0)answer(null)}
function answer(choice){if(state.locked)return;const remaining=Math.max(0,state.deadline-performance.now());if(remaining<=0)choice=null;state.locked=true;stopTimer();const q=state.selected[state.index],correct=choice===q.a;let gained=0;if(correct){const elapsed=15-remaining/1000;gained=8+(elapsed<=5?2:elapsed<=10?1:0);state.points+=gained;state.correct++}$('score').textContent=`${state.points}点`;[...$('answers').children].forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});const heading=document.createElement('strong');heading.textContent=correct?`正解！ +${gained}点`:choice===null?'時間切れ！':'残念！';const detail=document.createElement('p');detail.textContent=`正解：${q.o[q.a]}。${q.e}`;const fb=$('feedback');fb.classList.toggle('bad',!correct);fb.replaceChildren(heading,detail);fb.hidden=false;$('next-btn').textContent=state.index===9?'結果を見る →':'次の問題へ →';$('next-btn').hidden=false;$('next-btn').focus({preventScroll:true})}
function rankFor(n){if(n>=90)return['下野マスター','栃木の魅力を知り尽くした達人！'];if(n>=70)return['栃木愛の達人','かなり深い栃木愛です！'];if(n>=50)return['栃木通','名所も歴史もよく知っています！'];if(n>=30)return['栃木探検家','まだまだ知らない魅力が待っています！'];return['栃木ルーキー','ここから栃木の魅力を発見しよう！']}
function finish(){stopTimer();const [rank,copy]=rankFor(state.points);$('final-score').textContent=state.points;$('rank').textContent=rank;$('result-copy').textContent=copy;$('result-meta').textContent=`10問中${state.correct}問正解`;show('result')}
const PUBLIC_URL='https://tonde-saitama007.github.io/tochigi-ai-quiz/';
async function copyUrl(){let ok=false;try{await navigator.clipboard.writeText(PUBLIC_URL);ok=true}catch(e){const t=document.createElement('textarea');t.value=PUBLIC_URL;document.body.append(t);t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}t.remove()}$('copy-btn').textContent=ok?'リンクをコピーしました！':'コピーできませんでした'}
async function saveImage(){const b=$('image-share-btn');b.disabled=true;b.textContent='画像を準備中…';try{const cv=document.createElement('canvas');cv.width=1080;cv.height=1080;const ctx=cv.getContext('2d');if(!ctx)throw Error('canvas');ctx.fillStyle='#fff7ed';ctx.fillRect(0,0,1080,1080);ctx.fillStyle='#9a3925';ctx.beginPath();ctx.roundRect(55,50,100,100,24);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 64px sans-serif';ctx.fillText('栃',105,123);ctx.fillStyle='#853e2c';ctx.textAlign='left';ctx.font='bold 42px sans-serif';ctx.fillText('TOCHIGI LOVE QUIZ',180,115);ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(55,190,970,835,42);ctx.fill();ctx.fillStyle='#936029';ctx.font='bold 34px sans-serif';ctx.fillText('RESULT',115,285);ctx.fillStyle='#352a24';ctx.font='bold 64px sans-serif';ctx.fillText('あなたの栃木愛は…',115,395);ctx.fillStyle='#9a3925';ctx.font='bold 175px sans-serif';const score=String(state.points);ctx.fillText(score,115,630);const width=ctx.measureText(score).width;ctx.font='bold 57px sans-serif';ctx.fillText('点 / 100点',135+width,620);const [rank,desc]=rankFor(state.points);ctx.font='bold 46px sans-serif';ctx.fillStyle='#ffddb0';ctx.beginPath();ctx.roundRect(115,695,Math.min(850,ctx.measureText(rank).width+80),95,47);ctx.fill();ctx.fillStyle='#7d3c25';ctx.fillText(rank,155,760);ctx.fillStyle='#765f50';ctx.font='39px sans-serif';ctx.fillText(desc,115,865);ctx.font='30px sans-serif';ctx.fillText('栃木愛クイズ',115,950);const blob=await new Promise(resolve=>cv.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tochigi-love-quiz-result.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){$('status').textContent='画像を保存できませんでした。ブラウザを変えてお試しください。'}finally{b.disabled=false;b.textContent='画像を保存する'}}
$('start-btn').addEventListener('click',start);$('next-btn').addEventListener('click',()=>{if(state.index===9)finish();else{state.index++;render()}});$('retry-btn').addEventListener('click',()=>{stopTimer();show('start')});$('copy-btn').addEventListener('click',copyUrl);$('image-share-btn').addEventListener('click',saveImage);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.timer!==null)tick()});
</script></body></html>
